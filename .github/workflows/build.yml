name: Build & Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: yudit_shaper.dll
            lib-name: yudit_shaper.dll
          - os: ubuntu-latest
            artifact: yudit_shaper.so
            lib-name: yudit_shaper.so
          - os: macos-latest
            artifact: yudit_shaper.dylib
            lib-name: yudit_shaper.dylib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install cmake build twine

      - name: Configure & Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DYUDIT_BUILD_SHARED=ON
          cmake --build build --config Release

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -DYUDIT_BUILD_SHARED=ON
          cmake --build build --config Release

      - name: Find & copy native library
        shell: bash
        run: |
          mkdir -p src/pyyudit/_lib
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/Release/${{ matrix.artifact }} src/pyyudit/_lib/
          else
            # Try common CMake output locations
            found=$(find build -name "${{ matrix.artifact }}" -not -name "*.a" | head -1)
            if [ -z "$found" ]; then
              echo "ERROR: ${{ matrix.artifact }} not found in build/"
              find build -name "*.so*" -o -name "*.dylib" | head -20
              exit 1
            fi
            cp "$found" src/pyyudit/_lib/
          fi
          echo "Bundled library:"
          ls -la src/pyyudit/_lib/

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
